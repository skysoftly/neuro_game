name: Rename existing releases

on:
  push:
    branches: [master]
    paths:
      - "README.md"
      - "index.html"
      - ".github/workflows/build-release.yml"
      - ".github/workflows/rename-releases.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename all published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName --jq '.[].tagName' |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            gh release edit "$tag" --repo "${GITHUB_REPOSITORY}" --title "NEON VOID $tag"
          done
