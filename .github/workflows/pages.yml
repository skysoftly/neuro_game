name: Deploy game website
on:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "*.py"
      - "requirements-web.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser build tools
        run: python -m pip install --upgrade -r requirements-web.txt
      - name: Build WebAssembly game
        run: python -m pygbag --build --title "NEON VOID" --package "neon_void" .
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          mkdir -p _site/play
          cp -R build/web/. _site/play/
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
