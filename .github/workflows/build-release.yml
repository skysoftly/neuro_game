name: Build Windows EXE and publish release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=pygame -r requirements.txt pyinstaller pillow

      - name: Run checks
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Generate application icon
        run: python make_icon.py

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "NEON VOID" --icon "icon.ico" --add-data "icon.ico;." main.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "ПОСЛЕДНИЙ НА РАБОТЕ ${{ inputs.release_tag }}"
          generate_release_notes: true
          make_latest: true
          files: dist/NEON VOID.exe
