name: Build Windows x64 and publish release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example v0.1.0)"
        required: true
        default: "v0.2.0"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build NEON VOID for Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=pygame -r requirements.txt pyinstaller pillow
      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Generate application icon
        run: python make_icon.py
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "NEON VOID" --icon "icon.ico" --add-data "icon.ico;." main.py
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NEON-VOID-Windows-x64
          path: dist/NEON VOID.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'release: publish v0.2.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v0.2.0' }}
          name: "NEON VOID ${{ inputs.release_tag || 'v0.2.0' }}"
          generate_release_notes: true
          make_latest: true
          files: dist/NEON VOID.exe
