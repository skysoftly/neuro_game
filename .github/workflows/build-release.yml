name: Windows x64 build

on:
  push:
    branches:
      - master
      - release/v0.2.1
      - release/v0.2.2
      - release/v0.2.3
      - release/v0.2.5
      - fix/reliable-fullscreen-toggle
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release after a successful build"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag"
        required: false
        default: "v0.2.5"
        type: string

permissions:
  contents: write

concurrency:
  group: neon-void-windows-master
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test NEON VOID (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r requirements.txt pyinstaller pillow
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }

      - name: Compile and run tests
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Python compilation failed" }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed" }

      - name: Generate application icon
        shell: pwsh
        run: |
          python make_icon.py
          if ($LASTEXITCODE -ne 0) { throw "Icon generation failed" }
          if (-not (Test-Path "icon.ico")) { throw "icon.ico was not generated" }

      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "NEON VOID" --icon "icon.ico" --add-data "icon.ico;." main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          $exe = "dist/NEON VOID.exe"
          if (-not (Test-Path $exe)) { throw "Executable was not created" }
          $size = (Get-Item $exe).Length
          Write-Host "Built executable size: $size bytes"
          if ($size -lt 1000000) { throw "Executable is unexpectedly small ($size bytes)" }

      - name: Smoke-test packaged executable
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONNOUSERSITE: "1"
        run: |
          $exe = (Resolve-Path "dist/NEON VOID.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          Write-Host "Packaged executable exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "Packaged executable smoke test failed with exit code $($process.ExitCode)" }

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: "NEON VOID ${{ github.event_name == 'push' && (github.ref == 'refs/heads/release/v0.2.5' && 'v0.2.5' || github.ref == 'refs/heads/release/v0.2.3' && 'v0.2.3' || github.ref == 'refs/heads/release/v0.2.2' && 'v0.2.2' || 'v0.2.1') || inputs.release_tag || 'v0.2.5' }}"
          path: dist/NEON VOID.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && (github.ref == 'refs/heads/release/v0.2.1' || github.ref == 'refs/heads/release/v0.2.2' || github.ref == 'refs/heads/release/v0.2.3' || github.ref == 'refs/heads/release/v0.2.5'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/release/v0.2.5' && 'v0.2.5' || github.ref == 'refs/heads/release/v0.2.3' && 'v0.2.3' || github.ref == 'refs/heads/release/v0.2.2' && 'v0.2.2' || 'v0.2.1') || inputs.release_tag || 'v0.2.5' }}
          target_commitish: ${{ github.ref_name }}
          name: "NEON VOID ${{ github.event_name == 'push' && (github.ref == 'refs/heads/release/v0.2.3' && 'v0.2.3' || github.ref == 'refs/heads/release/v0.2.2' && 'v0.2.2' || 'v0.2.1') || inputs.release_tag || 'v0.2.0' }}"
          generate_release_notes: true
          make_latest: true
          files: dist/NEON VOID.exe
